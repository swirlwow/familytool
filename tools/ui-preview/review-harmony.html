<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭工具｜整體視覺統一檢視</title>
<style>body{margin:0;background:#fffdf7;color:#172b55;font:16px/1.6 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:28px}h1{font-size:26px;margin:0}p{color:#52627c}.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}article{background:white;border:1px solid #e5e3dc;border-radius:12px;overflow:hidden}h2{font-size:18px;margin:0;padding:12px 16px;background:#edf7fb}a{color:#176298}img{display:block;width:100%;height:auto}header{margin-bottom:24px}small{display:block;color:#52627c;padding:0 16px 12px}@media(max-width:800px){.pages{grid-template-columns:1fr}main{padding:16px}}</style></head>
<body><main><header><h1>家庭工具｜整體視覺統一檢視</h1><p>暖白底色・分區配色・精簡內頁・保留側欄貓咪。以下為本機假資料截圖，點標題可開啟互動頁面；未推送部署。</p></header><section class="pages" id="pages"></section></main>
<script>
const pages=[['記帳','ledger'],['財務儀表板','ledger/dashboard'],['拆帳管理','settlement'],['帳單管理','bills'],['股票管理','investments'],['行事曆','calendar'],['待購清單','shopping'],['便條紙','stickies'],['資料備份','settings/backup'],['記帳設定','settings/categories']];
for(const [i,[name,path]] of pages.entries()){const card=document.createElement('article');const heading=document.createElement('h2');const link=document.createElement('a');link.href='/'+path;link.textContent=(i+1)+'. '+name;heading.append(link);const img=document.createElement('img');img.src='/@fs/D:/@WORK/Shift%20Schedule/familytool-ui-pilot/docs/ui-reports/harmony-'+(i+1)+'.png';img.alt=name+'桌面預覽';img.loading='lazy';card.append(heading,img);document.getElementById('pages').append(card);}
const extra=[['結清紀錄','settlement/history'],['付款方式','settings/payment-methods'],['店家管理','settings/merchants'],['付款人管理','settings/payers'],['便條明細','stickies/note-0'],['刪除確認視窗（僅展示）','shopping']];
for(const [i,[name,path]] of extra.entries()){const card=document.createElement('article');const heading=document.createElement('h2');const link=document.createElement('a');link.href='/'+path;link.textContent=(i+11)+'. '+name;heading.append(link);const img=document.createElement('img');img.src='/@fs/D:/@WORK/Shift%20Schedule/familytool-ui-pilot/docs/ui-reports/harmony-extra-'+(i+1)+'.png';img.alt=name+'預覽';img.loading='lazy';card.append(heading,img);document.getElementById('pages').append(card);}
</script></body></html>
